name: Setup registry
description: Configure npm authentication for the selected registry provider.

inputs:
  provider:
    description: Registry provider.
    required: false
    default: npmjs
  url:
    description: Optional registry URL override.
    required: false
    default: ''
  scope:
    description: npm scope for the registry (for example @mariomh8).
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Validate provider
      shell: bash
      env:
        PROVIDER: ${{ inputs.provider }}
      run: |
        case "${PROVIDER}" in
          npmjs|github) ;;
          *)
            echo "::error::Unsupported registry provider '${PROVIDER}'. Use 'npmjs' or 'github'."
            exit 1
            ;;
        esac

    - name: Setup npm registry
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        registry-url: ${{ inputs.url || (inputs.provider == 'github' && 'https://npm.pkg.github.com' || 'https://registry.npmjs.org') }}
        scope: ${{ inputs.scope }}

    - name: Export GitHub Packages token
      if: inputs.provider == 'github'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: echo "NODE_AUTH_TOKEN=${GH_TOKEN}" >> "$GITHUB_ENV"
