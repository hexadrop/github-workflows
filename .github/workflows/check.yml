name: Check

on:
  workflow_call:
    inputs:
      commands:
        description: 'JSON array of commands to run (e.g. ["lint:ci", "typecheck"])'
        required: false
        type: string
        default: '["lint:ci", "typecheck"]'
      cache-commands:
        description: 'JSON array of commands that should use a cache'
        required: false
        type: string
        default: '["lint:ci"]'
      ref:
        description: 'Git ref or SHA to check out. Empty checks out the ref of the triggering event.'
        required: false
        type: string
        default: ''
      registry:
        description: 'Registry provider for private npm packages: npmjs or github. Empty disables registry setup.'
        required: false
        type: string
        default: ''
      registry-url:
        description: 'Optional npm registry URL override.'
        required: false
        type: string
        default: ''
      registry-scope:
        description: 'npm scope for the registry, for example @mariomh8. Required when registry is github.'
        required: false
        type: string
        default: ''

jobs:
  check:
    name: ${{ matrix.command }}
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      packages: 'read'
    strategy:
      matrix:
        command: ${{ fromJson(inputs.commands) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate registry provider
        if: inputs.registry != ''
        shell: bash
        env:
          PROVIDER: ${{ inputs.registry }}
          SCOPE: ${{ inputs.registry-scope }}
        run: |
          case "${PROVIDER}" in
            npmjs|github) ;;
            *)
              echo "::error::Unsupported registry provider '${PROVIDER}'. Use 'npmjs' or 'github'."
              exit 1
              ;;
          esac

          if [[ "${PROVIDER}" == "github" && -z "${SCOPE}" ]]; then
            echo "::error::registry-scope is required when registry is 'github'."
            exit 1
          fi

      - name: Setup npm registry
        if: inputs.registry != ''
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: ${{ inputs.registry-url || (inputs.registry == 'github' && 'https://npm.pkg.github.com' || 'https://registry.npmjs.org') }}
          scope: ${{ inputs.registry == 'github' && inputs.registry-scope || '' }}

      - name: Export GitHub Packages token
        if: inputs.registry == 'github'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "NODE_AUTH_TOKEN=${GH_TOKEN}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install

      - name: Cache
        uses: actions/cache@v6
        if: contains(fromJson(inputs.cache-commands), matrix.command)
        with:
          path: .eslintcache
          key: ${{ runner.os }}-${{ matrix.command }}

      - name: ${{ matrix.command }}
        run: bun run ${{ matrix.command }}
