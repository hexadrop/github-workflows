name: Check

on:
  workflow_call:
    inputs:
      commands:
        description: 'JSON array of commands to run (e.g. ["lint:ci", "typecheck"])'
        required: false
        type: string
        default: '["lint:ci", "typecheck"]'
      build-types:
        description: 'Whether to run bun build:types before the commands'
        required: false
        type: boolean
        default: true
      eslint-cache:
        description: 'Whether to enable ESLint cache for lint:ci'
        required: false
        type: boolean
        default: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    strategy:
      matrix:
        command: ${{ fromJson(inputs.commands) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: ESLint cache
        uses: actions/cache@v6
        if: inputs.eslint-cache && matrix.command == 'lint:ci'
        with:
          path: .eslintcache
          key: ${{ runner.os }}-node

      - name: Build types
        if: inputs.build-types
        run: bun build:types

      - name: ${{ matrix.command }}
        run: bun run ${{ matrix.command }}
