name: "Release: prepare"

on:
  workflow_call:
    inputs:
      base-branch:
        description: 'Base branch for the release PR'
        required: false
        type: string
        default: 'main'
      version-command:
        description: 'Command used to version the release (changesets version-script)'
        required: false
        type: string
        default: 'bun changeset version'
      use-app-token:
        description: 'Push the release commit with the hexabot GitHub App token instead of GITHUB_TOKEN'
        required: false
        type: boolean
        default: false
      registry:
        description: 'Registry provider for private npm packages: npmjs or github. Empty disables registry setup.'
        required: false
        type: string
        default: ''
      registry-url:
        description: 'Optional npm registry URL override.'
        required: false
        type: string
        default: ''
      registry-scope:
        description: 'npm scope for the registry, for example @mariomh8. Required when registry is github.'
        required: false
        type: string
        default: ''
    secrets:
      app-private-key:
        description: 'Private key of the hexabot GitHub App. Required when use-app-token is true'
        required: false

jobs:
  release-prepare:
    name: Prepare
    runs-on: ubuntu-latest
    concurrency:
      group: release-prepare
      cancel-in-progress: false
    permissions:
      contents: 'write'
      packages: 'read'
      pull-requests: 'write'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch base branch
        env:
          BASE_BRANCH: ${{ inputs.base-branch }}
        run: |
          if [[ "${BASE_BRANCH}" == "${GITHUB_REF_NAME}" ]]; then
            echo "The release runs from ${BASE_BRANCH}; nothing to fetch."
            exit 0
          fi

          git fetch origin "${BASE_BRANCH}:${BASE_BRANCH}"

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate registry provider
        if: inputs.registry != ''
        shell: bash
        env:
          PROVIDER: ${{ inputs.registry }}
          SCOPE: ${{ inputs.registry-scope }}
        run: |
          case "${PROVIDER}" in
            npmjs|github) ;;
            *)
              echo "::error::Unsupported registry provider '${PROVIDER}'. Use 'npmjs' or 'github'."
              exit 1
              ;;
          esac

          if [[ "${PROVIDER}" == "github" && -z "${SCOPE}" ]]; then
            echo "::error::registry-scope is required when registry is 'github'."
            exit 1
          fi

      - name: Setup npm registry
        if: inputs.registry != ''
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: ${{ inputs.registry-url || (inputs.registry == 'github' && 'https://npm.pkg.github.com' || 'https://registry.npmjs.org') }}
          scope: ${{ inputs.registry == 'github' && inputs.registry-scope || '' }}

      - name: Export GitHub Packages token
        if: inputs.registry == 'github'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "NODE_AUTH_TOKEN=${GH_TOKEN}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Capture release version
        id: release-version
        shell: bash
        run: |
          shopt -s nullglob

          is_monorepo="false"
          if [[ -f package.json ]] && jq -e '((.workspaces // []) | length) > 0' package.json > /dev/null 2>&1; then
            is_monorepo="true"
          elif [[ -f pnpm-workspace.yaml ]]; then
            is_monorepo="true"
          fi

          for changeset in .changeset/*.md; do
            if [[ "$changeset" == ".changeset/README.md" ]]; then
              continue
            fi

            if bun changeset status --output=release.json; then
              version="$(jq -r '.releases[0].newVersion // empty' release.json)"
              releases="$(jq -r '.releases | length' release.json)"
              rm release.json

              if [[ -n "$version" ]]; then
                title="chore: release v$version"
                if [[ "$is_monorepo" == "true" ]] || [[ "$releases" -gt 1 ]]; then
                  title="chore: release"
                fi

                echo "has-release=true" >> "$GITHUB_OUTPUT"
                echo "version=$version" >> "$GITHUB_OUTPUT"
                echo "title=$title" >> "$GITHUB_OUTPUT"
              else
                echo "has-release=false" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "has-release=false" >> "$GITHUB_OUTPUT"
            fi

            exit 0
          done

          echo "has-release=false" >> "$GITHUB_OUTPUT"

      - name: Mint app token
        id: app
        if: inputs.use-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.HEXABOT_CLIENT_ID }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update release pull request
        if: steps.release-version.outputs.has-release == 'true'
        uses: changesets/action@v2.1.2
        with:
          github-token: ${{ inputs.use-app-token && steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          version-script: ${{ inputs.version-command }}
          pr-base-branch: ${{ inputs.base-branch }}
          pr-draft: always
          commit-message: ${{ steps.release-version.outputs.title }}
          pr-title: ${{ steps.release-version.outputs.title }}

      - name: Add release label to release pull request
        if: steps.release-version.outputs.has-release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --base ${{ inputs.base-branch }} --head changeset-release/${{ inputs.base-branch }} --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            echo "Release pull request not found. Skipping."
            exit 0
          fi

          gh pr edit "$pr_number" --add-label release

      - name: Add merge reminder to release pull request body
        if: steps.release-version.outputs.has-release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --base ${{ inputs.base-branch }} --head changeset-release/${{ inputs.base-branch }} --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            echo "Release pull request not found. Skipping."
            exit 0
          fi

          body="$(gh pr view "$pr_number" --json body --jq '.body')"
          if [[ "$body" != *"Merge this pull request using"* ]]; then
            reminder="> [!IMPORTANT]
          > Merge this pull request using **Create a merge commit** so ${{ inputs.base-branch }} keeps the full history from develop."
            new_body="${body}"$'\n\n'"${reminder}"
            jq -n --arg body "$new_body" '{"body": $body}' | gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" --method PATCH --input -
          fi
