name: "Release: publish"

on:
  workflow_call:
    inputs:
      snapshot:
        description: 'Publish a snapshot release (beta) instead of a stable release'
        required: false
        type: boolean
        default: false
      concurrency-group:
        description: 'Concurrency group name'
        required: true
        type: string
      target:
        description: 'How releases are published: registry (npm) or git tags + GitHub Releases'
        required: false
        type: string
        default: ''
      publish-strategy:
        description: 'Deprecated: use target instead. How releases are published: npm/registry or tags'
        required: false
        type: string
        default: 'npm'
    outputs:
      published:
        description: 'Whether packages were published'
        value: ${{
          jobs.publish-registry-stable.outputs.published == 'true' ||
          jobs.publish-registry-beta.outputs.published == 'true' ||
          jobs.publish-tags-stable.outputs.published == 'true' ||
          jobs.publish-tags-beta.outputs.published == 'true'
          }}

jobs:
  setup:
    name: Resolve release target
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.resolve.outputs.target }}
    steps:
      - name: Resolve target
        id: resolve
        shell: bash
        run: |
          raw="${{ inputs.target || inputs.publish-strategy }}"
          case "$raw" in
            npm|registry)
              echo "target=registry" >> "$GITHUB_OUTPUT"
              ;;
            tags)
              echo "target=tags" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unknown publish target '$raw'. Use 'registry' (default) or 'tags'."
              exit 1
              ;;
          esac

  publish-registry-beta:
    name: Publish registry beta snapshot
    needs: setup
    if: needs.setup.outputs.target == 'registry' && inputs.snapshot
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ inputs.concurrency-group }}
      cancel-in-progress: false
    permissions:
      contents: 'write'
      id-token: 'write'
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate beta snapshot
        run: bun changeset version --snapshot beta

      - name: Publish beta to npm
        id: publish
        run: |
          bun changeset publish --tag beta --no-git-tag
          echo "published=true" >> "$GITHUB_OUTPUT"

  publish-registry-stable:
    name: Publish registry stable release
    needs: setup
    if: needs.setup.outputs.target == 'registry' && !inputs.snapshot
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ inputs.concurrency-group }}
      cancel-in-progress: false
    permissions:
      contents: 'write'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Capture release version
        run: |
          bun changeset status --output=release.json
          echo "NEW_VERSION=$(jq -r '.releases[0].newVersion' release.json)" >> "$GITHUB_ENV"
          rm release.json

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2.1.1
        with:
          publish-script: bun changeset publish
          version-script: bun changeset version
          commit-message: 'chore: release v${{env.NEW_VERSION}}'
          pr-title: 'chore: release v${{env.NEW_VERSION}}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-tags-beta:
    name: Tag beta snapshot release
    needs: setup
    if: needs.setup.outputs.target == 'tags' && inputs.snapshot
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ inputs.concurrency-group }}
      cancel-in-progress: false
    permissions:
      contents: 'write'
    outputs:
      published: ${{ steps.tag.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Tag beta snapshot release
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun changeset version --snapshot beta
          version="$(jq -r '.version' package.json)"
          git checkout -- package.json
          git checkout -- CHANGELOG.md 2> /dev/null || true

          tag="v${version}"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null; then
            echo "Tag ${tag} already exists on origin. Skipping."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git tag "${tag}"
          if ! git push origin "${tag}"; then
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null; then
              echo "Tag ${tag} was created concurrently. Skipping."
              echo "published=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit 1
          fi

          gh release create "${tag}" --prerelease --generate-notes

          echo "published=true" >> "$GITHUB_OUTPUT"

  publish-tags-stable:
    name: Tag stable release
    needs: setup
    if: needs.setup.outputs.target == 'tags' && !inputs.snapshot
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ inputs.concurrency-group }}
      cancel-in-progress: false
    permissions:
      contents: 'write'
    outputs:
      published: ${{ steps.tag.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Tag stable release
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(jq -r '.version' package.json)"
          tag="v${version}"
          major="v${version%%.*}"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null; then
            echo "Tag ${tag} already exists on origin. Skipping."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git tag "${tag}"
          if ! git push origin "${tag}"; then
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null; then
              echo "Tag ${tag} was created concurrently. Skipping."
              echo "published=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit 1
          fi

          git tag -f "${major}" "${tag}"
          git push -f origin "${major}"

          gh release create "${tag}" --latest --generate-notes

          echo "published=true" >> "$GITHUB_OUTPUT"
