name: "Renovate: approve"

on:
  workflow_call:
    secrets:
      app-private-key:
        description: 'Private key of the hexabot GitHub App'
        required: true

permissions: {}

jobs:
  approve:
    name: Approve
    if: >-
      github.event.pull_request.user.type == 'Bot' &&
      startsWith(github.event.pull_request.head.ref, 'renovate/') &&
      github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'dependencies')
    runs-on: ubuntu-latest

    steps:
      - name: Mint app token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.HEXABOT_CLIENT_ID }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: write

      - name: Approve the pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr review "$PR_NUMBER" --approve \
            --body "Automatically approved: dependency update with the required checks enforced by GitHub." > /dev/null \
            || echo "Already approved or approval not possible"
