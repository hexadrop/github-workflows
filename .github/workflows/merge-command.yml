name: "Pull Request: merge command"

on:
  workflow_call:
    secrets:
      app-private-key:
        description: 'Private key of the hexabot GitHub App'
        required: true

permissions: {}

concurrency:
  group: merge-command-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  merge:
    name: Merge
    if: github.event.issue.pull_request != null
    runs-on: ubuntu-latest

    steps:
      - name: Mint app token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.HEXABOT_CLIENT_ID }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: read
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Run merge command
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_USER_TYPE: ${{ github.event.comment.user.type }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          set -euo pipefail

          post() {
            gh pr comment "$PR_NUMBER" --body "$1" > /dev/null
            echo "$1"
          }

          react() {
            gh api --method POST \
              "/repos/$GH_REPO/issues/comments/$COMMENT_ID/reactions" \
              -f content="$1" > /dev/null 2>&1 || true
          }

          refuse() {
            post "$1"
            react "-1"
            exit 0
          }

          command="$(printf '%s' "$COMMENT_BODY" | head -n 1 | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ "$command" != "/merge" ]; then
            exit 0
          fi

          if [ "$COMMENT_USER_TYPE" = "Bot" ]; then
            echo "Ignoring a bot comment"
            exit 0
          fi

          case "$AUTHOR_ASSOCIATION" in
            OWNER | MEMBER | COLLABORATOR) ;;
            *) refuse "Only users with write access can run \`/merge\`." ;;
          esac

          react "eyes"

          pr="$(gh pr view "$PR_NUMBER" \
            --json id,headRefName,baseRefName,isDraft,mergeable,mergeStateStatus,headRefOid)"
          pr_id="$(jq -r '.id' <<< "$pr")"
          head="$(jq -r '.headRefName' <<< "$pr")"
          base="$(jq -r '.baseRefName' <<< "$pr")"
          draft="$(jq -r '.isDraft' <<< "$pr")"
          mergeable="$(jq -r '.mergeable' <<< "$pr")"
          state="$(jq -r '.mergeStateStatus' <<< "$pr")"
          sha="$(jq -r '.headRefOid' <<< "$pr")"

          method="squash"
          case "$head" in
            changeset-release/* | internal/sync-* | release/*) method="merge" ;;
          esac

          has_develop="false"
          if gh api "/repos/$GH_REPO/branches/develop" > /dev/null 2>&1; then
            has_develop="true"
          fi

          if [ "$base" = "main" ] && [ "$has_develop" = "true" ]; then
            case "$head" in
              changeset-release/* | release/* | hotfix/*) ;;
              *) refuse "This pull request targets \`main\` from \`$head\`, which is not a release or hotfix branch. Merge it by hand if that is intended." ;;
            esac
          fi

          if [ "$draft" = "true" ]; then
            case "$head" in
              changeset-release/*)
                gh api graphql \
                  -f query='mutation($pr: ID!) { markPullRequestReadyForReview(input: {pullRequestId: $pr}) { pullRequest { isDraft } } }' \
                  -f pr="$pr_id" > /dev/null
                echo "Marked the release pull request as ready"
                ;;
              *) refuse "This pull request is a draft. Mark it as ready before running \`/merge\`." ;;
            esac
          fi

          if [ "$mergeable" = "CONFLICTING" ] || [ "$state" = "DIRTY" ]; then
            refuse "This pull request has conflicts with \`$base\`. Resolve them and run \`/merge\` again."
          fi

          if [ "$state" = "BEHIND" ]; then
            gh api graphql \
              -f query='mutation($pr: ID!, $sha: GitObjectID) { updatePullRequestBranch(input: {pullRequestId: $pr, expectedHeadOid: $sha}) { clientMutationId } }' \
              -f pr="$pr_id" \
              -f sha="$sha" > /dev/null
            sha="$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')"
            echo "Updated the branch with $base"
          fi

          deadline=$((SECONDS + 900))
          started=$SECONDS

          while :; do
            runs="$(gh api "/repos/$GH_REPO/commits/$sha/check-runs?per_page=100")"
            latest="$(jq '[.check_runs[]] | sort_by(.id) | group_by(.name) | map(.[-1])' <<< "$runs")"
            total="$(jq 'length' <<< "$latest")"
            pending="$(jq '[.[] | select(.status != "completed")] | length' <<< "$latest")"
            failing="$(jq -r '[.[] | select(.status == "completed") | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral") | .name] | join(", ")' <<< "$latest")"

            if [ -n "$failing" ]; then
              refuse "These checks are failing: $failing. Fix them and run \`/merge\` again."
            fi

            if [ "$pending" = "0" ]; then
              if [ "$total" != "0" ] || [ $((SECONDS - started)) -ge 60 ]; then
                break
              fi
              echo "Waiting for the checks to start..."
            else
              echo "Waiting for $pending check(s)..."
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              refuse "The checks are still running after 15 minutes. Run \`/merge\` again when they finish."
            fi

            sleep 20
          done

          if output="$(gh api --method PUT "/repos/$GH_REPO/pulls/$PR_NUMBER/merge" \
            -f merge_method="$method" \
            -f sha="$sha" 2>&1)"; then
            post "Merged with **$method** at \`${sha:0:7}\`."
            react "rocket"
          else
            refuse "Merge failed: $output"
          fi
